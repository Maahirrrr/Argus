<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argus — The AI Product Manager Operating System</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Single Page App hash redirect for GitHub Pages
      var fullPath = window.location.pathname;
      var repoPrefix = '/Argus';
      var cleanPath = fullPath;
      if (cleanPath.startsWith(repoPrefix)) {
        cleanPath = cleanPath.slice(repoPrefix.length);
      }
      cleanPath = cleanPath.replace(/^\/+/, '');
      var hash = window.location.hash || '';
      if (cleanPath && !hash) {
        window.location.replace(repoPrefix + '/#/' + cleanPath);
      } else {
        window.location.replace(repoPrefix + '/' + (hash || '#/cockpit'));
      }
    </script>
  </head>
  <body style="background:#050505;color:#F5F5F0;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p style="font-family:monospace;font-size:12px;color:#8A8A8A;">INITIALIZING ARGUS COCKPIT...</p>
  </body>
</html>
